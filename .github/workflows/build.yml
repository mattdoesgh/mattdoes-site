name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Security + dependency hygiene. Fails on moderate+ advisories in either
  # production or dev deps. Pinned to a single Node version (matches .nvmrc)
  # so the audit result is reproducible between runs. Cloudflare Pages
  # deploys independently of GitHub Actions, so a red audit blocks PR merge
  # but does not block the production deploy.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts skips lifecycle scripts. Audit root, then workers.
      - name: Install (root)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Audit (root, prod + dev)
        run: npm run audit

      # All three Workers share one tooling package root (workers/package.json,
      # wrangler devDep) — audit it once, same threshold.
      - name: Audit (workers)
        working-directory: workers
        run: npm audit --audit-level=moderate

  build:
    name: build + html-validate
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Notes live in content/. The build does not clone a vault.

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Typecheck (site)
        run: npm run typecheck

      - name: Build
        env:
          SITE_URL: https://mattdoes.online
          # CI has no Last.fm creds and no cache; stay offline so the build
          # never depends on the live Worker (lib/listening.js). The static
          # listening snapshot is empty here — the deployed site builds with a
          # real SITE_URL and reaches the Worker.
          LISTENING_OFFLINE: '1'
          # Same posture for the Letterboxd diary RSS (lib/watches.js). The
          # production Pages build does not set this, so /watching/ is baked
          # from the live feed there.
          LETTERBOXD_OFFLINE: '1'
        run: npm run build

      - name: Lint (html-validate)
        run: npm run lint

      - name: Check asset budget
        run: npm run check:assets

      - name: Check design tokens
        run: npm run check:tokens

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  # Regression suite. Runs the node:test files under test/ (build input
  # validation, URL output safety, Atom feed standards, structural
  # accessibility via axe/jsdom, token-level contrast, Worker robustness,
  # privacy storage, progressive enhancement, and W3C/lint coverage).
  # `npm test` is self-contained — its `pretest` step builds the in-repo
  # content, and build-dependent tests rebuild in their own before() hooks.
  test:
    name: regression tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret-history test scans every commit. A shallow clone would
          # hide a credential committed before this PR.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Run regression test suite
        run: npm test

  # Screenshot baselines of the main pages, plus axe on every page in
  # Chromium. Fixture watches and scrobbles stand in for Letterboxd and
  # Last.fm so a live feed cannot move the pixels. Same job as the
  # screenshots, so the accessibility check does not add a runner.
  visual:
    name: visual regression
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare screenshots and run axe
        run: npm run test:visual

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression
          path: |
            test/visual/test-results
            playwright-report
          retention-days: 7
