<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>matt does unshared</title>
    <link rel="stylesheet" href="ambient.css">
  </head>
  <body data-polarity="flip">
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main">
      <h1 class="sign"><a href="/unshared/">matt does unshared</a></h1>
      <div class="stage">
        <canvas class="field" id="field" tabindex="0" aria-label="Flock in a cube. Drag to turn, pinch to zoom, tap a bird to solo it. One bird solos on its own."></canvas>
      </div>
      <div class="bar">
        <button type="button" class="play" id="play" aria-pressed="false" aria-label="play">
          <span class="play-label" aria-hidden="true"><span class="label-play">play</span><span class="label-stop">stop</span></span>
        </button>
        <label class="slider"><span>volume</span><input type="range" id="volume" min="0" max="100" step="1" value="35"></label>
      </div>
    </main>
    <script type="module" src="ambient.js"></script>
  </body>
</html>
