name = "mattdoes-listening"
main = "src/index.js"
compatibility_date = "2026-04-01"
workers_dev = false

# Workers-on-Routes take precedence over Pages, so /api/listening/* is
# handled here instead of returning a 404 from the static site.
routes = [
  { pattern = "mattdoes.online/api/listening/now",    zone_name = "mattdoes.online" },
  { pattern = "mattdoes.online/api/listening/recent", zone_name = "mattdoes.online" },
  { pattern = "mattdoes.online/api/listening/charts", zone_name = "mattdoes.online" }
]

# KV namespace for cached Last.fm payloads. The poller writes now/recent.
# GET /api/listening/charts writes `charts:week` on a cold miss. The Monday
# cron replaces that snapshot.
#
# One-time setup — wrangler validates the whole config before running any
# command, so the binding block has to be commented out until the namespace
# exists. Steps:
#   1. Leave the block below commented on first deploy.
#   2. Run, from this directory: node ../node_modules/wrangler/bin/wrangler.js kv namespace create LASTFM_CACHE
#   3. Uncomment the block and paste the returned id into `id = "..."`.
#   4. From the repo root: npm run deploy:workers
#
# Add `preview_id = "..."` alongside `id` if you want a separate namespace
# for `wrangler dev`.
#
[[kv_namespaces]]
binding = "LASTFM_CACHE"
id      = "a6ea68e07a764aeba929a865d1d33a58"

# Producer Durable Object — the single recent-tracks writer. A self-rescheduling
# alarm (~25s, see POLL_INTERVAL_MS in src/index.js) makes one
# user.getrecenttracks call and writes both KV payloads, so that call volume
# is constant. /now and /recent never touch Last.fm. /charts does, only when
# `charts:week` is missing. The Monday cron refreshes it every week.
# A singleton instance (idFromName('singleton')); it serves no visitor traffic,
# so it is a background poller, not a request bottleneck.
[[durable_objects.bindings]]
name       = "LISTENING_POLLER"
class_name = "ListeningPoller"

# SQLite-backed DO. The class holds no SQL tables — only its alarm — but the
# storage backend must be declared. Migrations are not casually reversible;
# land this deliberately.
[[migrations]]
tag                = "v1"
new_sqlite_classes = ["ListeningPoller"]

# Two crons. The minute tick only arms the recent-tracks poller. It makes NO
# Last.fm call. `0 11 * * 1` refreshes the monthly album chart and asks
# mattdoes-rebuild to redeploy Pages. 11:00 UTC is 6:00 AM US Central during
# daylight time (CDT, UTC−5) and 5:00 AM US Central during standard time
# (CST, UTC−6). Cron invocations carry no client IP and are not subject to
# LISTEN_RL.
[triggers]
crons = ["* * * * *", "0 11 * * 1"]

# Listening → rebuild. The Monday cron POSTs /rebuild on this binding.
# mattdoes-rebuild has no public route.
[[services]]
binding = "REBUILD"
service = "mattdoes-rebuild"

# Workers Rate Limiting binding (GA Sep 2025). Blocks abusive single-IP floods
# before they touch KV. Keyed on a hash of cf-connecting-ip plus the pathname
# inside the Worker so /now, /recent, and /charts are budgeted independently,
# and a missing IP fails closed. The raw address is not the binding key.
#
# Constraint: `simple.period` only accepts 10 or 60. A "100 / 10 min" window
# isn't expressible here; for a wider window switch to a WAF rate-limiting
# rule (dashboard → Security → WAF → Rate limiting rules) targeting
# `http.request.uri.path matches "^/api/listening/"`.
#
# `namespace_id` is a per-account integer label. Bump it to give this
# worker its own budget.
[[ratelimits]]
name         = "LISTEN_RL"
namespace_id = "2001"

  [ratelimits.simple]
  limit  = 100   # requests per IP+path per `period`
  period = 60    # seconds — must be 10 or 60

# No [vars] block — LASTFM_USERNAME and LASTFM_API_KEY are set as secrets via
# `wrangler secret put` so the username stays out of the public repo.

# The poller's Last.fm URL carries the API key in the query string. Workers
# traces record url.full and url.query for outbound fetch, so traces stay
# off. redact_query_string strips that query if logs are turned on later.
[observability]
redact_query_string = true

  [observability.traces]
  enabled = false
